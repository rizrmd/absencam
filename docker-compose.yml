services:
  postgres:
    image: postgres:17-alpine
    container_name: absencam-postgres
    environment:
      POSTGRES_USER: absencam
      POSTGRES_PASSWORD: absencam
      POSTGRES_DB: absencam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absencam -d absencam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
